<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MoMo fraud film – scene renderer</title>
<style>
  @font-face { font-family: Figtree; font-weight: 500; src: url(/node_modules/@fontsource/figtree/files/figtree-latin-500-normal.woff2); }
  @font-face { font-family: Figtree; font-weight: 600; src: url(/node_modules/@fontsource/figtree/files/figtree-latin-600-normal.woff2); }
  @font-face { font-family: Figtree; font-weight: 700; src: url(/node_modules/@fontsource/figtree/files/figtree-latin-700-normal.woff2); }
  @font-face { font-family: Figtree; font-weight: 800; src: url(/node_modules/@fontsource/figtree/files/figtree-latin-800-normal.woff2); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
  #gl { position: absolute; left: -99999px; }
</style>
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
  // Usage: /scene/index.html?scene=scene1          live preview (plays with audio on click)
  //        driven by render.mjs via window.renderFrame(i) for final frames.
  import * as THREE from 'three';
  import { makeOverlay } from './lib/overlay.js';

  const params = new URLSearchParams(location.search);
  const name = params.get('scene') || 'scene1';
  const W = 1920, H = 1080;

  await Promise.all(['500', '600', '700', '800'].map((w) => document.fonts.load(`${w} 40px Figtree`)));
  const timeline = await (await fetch(`/build/${name}/timeline.json`)).json();
  const mod = await import(`./scenes/${name}.js`);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.domElement.id = 'gl';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 600);
  const overlay = makeOverlay(W, H);
  document.body.appendChild(overlay.canvas);
  const { update } = mod.build(scene, timeline);
  const frames = Math.round(timeline.duration * timeline.fps);

  window.SCENE_INFO = { frames, fps: timeline.fps, duration: timeline.duration };
  window.renderFrame = (i, quality = 0.93) => {
    update(i / timeline.fps, i, camera, overlay, renderer.domElement, renderer);
    return overlay.canvas.toDataURL('image/jpeg', quality);
  };

  if (!params.has('capture')) {
    const audio = new Audio(`/build/${name}/mix.wav`);
    let t0 = null;
    const loop = (now) => {
      const t = t0 === null ? 0 : ((now - t0) / 1000) % timeline.duration;
      update(t, Math.floor(t * timeline.fps), camera, overlay, renderer.domElement, renderer);
      requestAnimationFrame(loop);
    };
    document.body.addEventListener('click', () => { t0 = performance.now(); audio.currentTime = 0; audio.play(); });
    requestAnimationFrame(loop);
  }
  window.SCENE_READY = true;
</script>
</body>
</html>
